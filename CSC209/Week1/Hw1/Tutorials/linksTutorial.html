        <h1>Links Tutorial</h1>
        <h2>Relative URLs</h2>
        <p>A local link is a link to a page within the website. In other words, links without "https://www".</p>
        <h3>Example of an image using relative URL.</h3>
        <img src="../Images/guerrero.jpg">
        <h2>Absoulte URLs</h2>
        <p>A full web address.</p>
        <h3>Example of an image using absolute URL.</h3>
        <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e1/Zona_Arqueol%C3%B3gica_Tehuacalco%2C_Chilpancingo%2C_Guerrero-_Tehuacalco_Arqueologic_Zone%2C_Guerrero_%2824832596181%29.jpg/500px-Zona_Arqueol%C3%B3gica_Tehuacalco%2C_Chilpancingo%2C_Guerrero-_Tehuacalco_Arqueologic_Zone%2C_Guerrero_%2824832596181%29.jpg?utm_source=en.wikipedia.org&utm_campaign=parser&utm_content=thumbnail">
